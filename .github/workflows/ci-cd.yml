name: CI / SiteGround testing

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested default branch to SiteGround
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend / release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test
      - run: npm run package:v1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siteground-release
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  backend:
    name: PHP / MySQL / deployment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: duel_v1_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, zip, mbstring
          ini-values: memory_limit=256M
          coverage: none
      - run: find server public/api scripts/ci -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php scripts/ci/configure-test.php
      - run: php server/tests/run.php
      - run: php scripts/ci/deploy-test.php
      - run: bash -n scripts/ci/deploy-siteground.sh

  solver:
    name: Python solver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest

  deploy:
    name: Deploy testing
    needs: [frontend, backend, solver]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.DEPLOY_TESTING == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: siteground-testing
      url: ${{ vars.SITEGROUND_URL }}
    concurrency:
      group: siteground-testing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: siteground-release
          path: release
      - name: Publish the tested artifact
        env:
          SITEGROUND_HOST: ${{ secrets.SITEGROUND_HOST }}
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
          SITEGROUND_SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SITEGROUND_KNOWN_HOSTS: ${{ secrets.SITEGROUND_KNOWN_HOSTS }}
          SITEGROUND_PORT: ${{ vars.SITEGROUND_PORT }}
          SITEGROUND_ROOT: ${{ vars.SITEGROUND_ROOT }}
          SITEGROUND_PHP: ${{ vars.SITEGROUND_PHP }}
          SITEGROUND_URL: ${{ vars.SITEGROUND_URL }}
        run: bash scripts/ci/deploy-siteground.sh
