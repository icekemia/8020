[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duel-solver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]

[project.scripts]
duel-solver = "duel_solver.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
